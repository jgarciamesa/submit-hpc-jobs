#------------------------------------------------------------
# Values for this lesson.
#------------------------------------------------------------

# Which carpentry is this (swc, dc, lc, hpcc, cp, incubator, or lab)?
# incubator: The Carpentries Incubator
carpentry: 'incubator'

# Alt-text description of the lesson.
carpentry_description: 'Lesson Description'

# Overall title for pages.
title: 'Submitting AI Jobs to the Anvil Supercomputer'

# Date the lesson was created (YYYY-MM-DD, this is empty by default)
created: '2026-09-08'

# Comma-separated list of keywords for the lesson
keywords: 'HPC, Slurm, supercomputing, machine learning, GPU, AI, Anvil, ACCESS, NAIRR'

# Life cycle stage (pre-alpha, alpha, beta, stable). Intentionally left
# unset: an unset life_cycle suppresses the lifecycle badge in the header.

# License of the lesson
license: 'CC-BY 4.0'

# Link to the source repository for this lesson
source: 'https://github.com/jgarciamesa/submit-hpc-jobs'

# Default branch of your lesson
branch: 'main'

# Who to contact if there are any issues
contact: 'jgarc111@asu.edu'

# Navigation ------------------------------------------------
#
# Use the following menu items to specify the order of
# individual pages in each dropdown section. Leave blank to
# include all pages in the folder.

# Order of episodes in your lesson
episodes:
- 01-introduction.md
- 02-connecting-to-anvil.md
- 03-meeting-anvils-queues.md
- 04-your-first-job.md
- 05-an-ai-job-on-cpu.md
- 06-an-ai-job-on-a-gpu.md
- 07-job-arrays.md
- 08-wrap-up.md

# Information for Learners
learners:
- setup.md
- reference.md

# Information for Instructors
instructors:
- instructor-notes.md

# Learner Profiles
profiles:
- learner-profiles.md

# Customisation ---------------------------------------------
#
# This space below is where custom yaml items (e.g. pinning
# sandpaper and varnish versions) should live

# Exclude the workshop session kit from the site build
build_ignore:
- workshop
